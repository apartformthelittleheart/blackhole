<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#hint{position:fixed;left:0;right:0;bottom:20px;text-align:center;color:#8fb4ff;font-size:14px;opacity:.75;pointer-events:none}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="hint">hold mouse / finger to pull the stars &nbsp;•&nbsp; press <b>R</b> or double-click to reset</div>
<script>
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W,H,cx,cy;
const N=3500, GM=2600, EVENT=14;
let P=[],mouse={x:0,y:0,down:false};
 
function spawn(p,outer){
  const ang=Math.random()*Math.PI*2;
  const r=outer?Math.max(W,H)*.5+Math.random()*60:EVENT*2+Math.pow(Math.random(),.6)*Math.min(W,H)*.45;
  const v=Math.sqrt(GM/r)*(0.85+Math.random()*.3);
  p.x=cx+Math.cos(ang)*r;p.y=cy+Math.sin(ang)*r;
  // tangential velocity -> everything orbits the same way, flattened into a disk
  p.vx=-Math.sin(ang)*v;p.vy=Math.cos(ang)*v;
  p.s=Math.random()*1.2+.4;
  return p;
}
function init(){
  W=cv.width=innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H/2;
  P=Array.from({length:N},()=>spawn({}));
  ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
}
addEventListener("resize",init);
addEventListener("keydown",e=>{if(e.key.toLowerCase()==="r")init()});
addEventListener("dblclick",init);
addEventListener("pointerdown",e=>{mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("pointermove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("pointerup",()=>mouse.down=false);
init();
 
function frame(){
  // fading trail
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="rgba(0,0,0,.14)";ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="lighter";
 
  for(const p of P){
    for(let k=0;k<2;k++){                       // two sub-steps = smoother orbits
      let dx=cx-p.x,dy=cy-p.y,d2=dx*dx+dy*dy+30,d=Math.sqrt(d2);
      let a=GM/d2;p.vx+=dx/d*a*.5;p.vy+=dy/d*a*.5;
      if(mouse.down){
        const mx=mouse.x-p.x,my=mouse.y-p.y,m2=mx*mx+my*my+900,md=Math.sqrt(m2);
        const f=1400/m2;p.vx+=mx/md*f*.5;p.vy+=my/md*f*.5;
      }
      p.x+=p.vx*.5;p.y+=p.vy*.5;
    }
    const dx=p.x-cx,dy=p.y-cy,r=Math.sqrt(dx*dx+dy*dy);
    if(r<EVENT||r>Math.max(W,H)*1.2){spawn(p,true);continue}   // swallowed -> new star at the edge
    const sp=Math.min(1,Math.hypot(p.vx,p.vy)/4.5);             // fast = hot
    const hue=220-sp*185,light=48+sp*30;                        // blue -> orange/white
    ctx.fillStyle=`hsla(${hue},100%,${light}%,${.35+sp*.55})`;
    ctx.fillRect(p.x,p.y,p.s+sp,p.s+sp);
  }
 
  // black hole + glowing ring
  ctx.globalCompositeOperation="source-over";
  const g=ctx.createRadialGradient(cx,cy,EVENT*.9,cx,cy,EVENT*2.6);
  g.addColorStop(0,"rgba(255,190,90,.55)");g.addColorStop(.35,"rgba(255,120,40,.18)");g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,EVENT*2.6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#000";ctx.beginPath();ctx.arc(cx,cy,EVENT,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="rgba(255,220,160,.9)";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(cx,cy,EVENT,0,Math.PI*2);ctx.stroke();
 
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
